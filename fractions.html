<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Fraction Visualizer — VisMath</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-stone-100 text-slate-800">

  <header class="px-6 pt-6 pb-4 max-w-[52rem] mx-auto">
    <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800">&larr; Back</a>
    <h1 class="text-2xl font-bold mt-1 text-slate-900">Fraction Visualizer</h1>
  </header>

  <!-- Ask for a fraction -->
  <dialog id="js-fraction-input"
    class="m-auto rounded-2xl p-8 bg-white text-slate-800 shadow-2xl backdrop:bg-slate-900/40">

    <form id="js-fraction-form" method="dialog" class="flex flex-col items-center gap-6">
      <p class="text-sm font-medium text-slate-500">Type a fraction</p>

      <div class="flex flex-col items-center">
        <input id="js-input-numerator" type="number" inputmode="numeric" value="1"
          class="w-28 text-center text-5xl font-bold p-1 bg-transparent
                 border-b-4 border-slate-800 appearance-none focus:outline-none">
        <input id="js-input-denominator" type="number" inputmode="numeric" value="2"
          class="w-28 text-center text-5xl font-bold p-1 bg-transparent
                 appearance-none focus:outline-none">
      </div>

      <p id="js-fraction-input-error" class="text-sm font-medium text-red-600 h-5"></p>

      <div class="flex gap-3">
        <button value="cancel"
          class="rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 px-5 h-11">Cancel</button>
        <button value="confirm"
          class="rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-medium px-6 h-11">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Ask for a whole number -->
  <dialog id="js-number-input"
    class="m-auto rounded-2xl p-8 bg-white text-slate-800 shadow-2xl backdrop:bg-slate-900/40">

    <form id="js-number-form" method="dialog" class="flex flex-col items-center gap-6">
      <p class="text-sm font-medium text-slate-500">Type a number</p>

      <input id="js-input-number" type="number" inputmode="numeric" value="1"
        class="w-32 text-center text-5xl font-bold p-1 bg-transparent
               appearance-none focus:outline-none">

      <p id="js-number-input-error" class="text-sm font-medium text-red-600 h-5"></p>

      <div class="flex gap-3">
        <button value="cancel"
          class="rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 px-5 h-11">Cancel</button>
        <button value="confirm"
          class="rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-medium px-6 h-11">Add</button>
      </div>
    </form>
  </dialog>

  <main class="px-6 pb-8 flex flex-col items-center gap-4">

    <div id="js-fraction-stage"
      class="w-full max-w-[52rem] h-[35rem] relative overflow-auto select-none touch-none
             bg-white rounded-2xl border border-slate-200 shadow-sm">
    </div>

    <div class="flex flex-wrap justify-center gap-3">
      <button id="js-fraction-add-fraction-button"
        class="rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-medium px-5 h-11">Add Fraction</button>
      <button id="js-fraction-add-number-button"
        class="rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-medium px-5 h-11">Add Number</button>
      <button id="js-fraction-clear-button"
        class="rounded-xl bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium px-5 h-11">Clear</button>
    </div>
  </main>

  <!-- JS goes at the end of body, so the HTML above already exists when it runs. -->
  <script src="js/fractions.js"></script>
</body>
</html>
