<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Fraction Visualizer — VisMath</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-mist-900 dark:text-slate-100">

  <header class="p-6">
    <a href="index.html" class="text-blue-600 dark:text-blue-400 underline">&larr; Back</a>
    <h1 class="text-3xl font-bold mt-2">Fraction Visualizer</h1>
  </header>
  <dialog id="js-fraction-input" class="m-auto rounded-xl p-6 bg-slate-50 text-slate-900 dark:bg-mist-800 dark:text-slate-100
           backdrop:bg-black/50">

    <form id="js-fraction-form" method="dialog" class="flex flex-col items-center gap-5">
      <p class="text-sm opacity-70">Type a fraction</p>
      <div class="flex flex-col items-center">
        <input id="js-input-numerator" type="number" inputmode="numeric" value="1" class="w-24 text-center text-4xl font-bold p-1 bg-transparent
                 border-b-4 border-current appearance-none focus:outline-none">
        <input id="js-input-denominator" type="number" inputmode="numeric" value="2" class="w-24 text-center text-4xl font-bold p-1 bg-transparent
                 appearance-none focus:outline-none">
      </div>

      <p id="js-fraction-input-error" class="text-sm text-red-600 dark:text-red-400 h-5"></p>

      <div class="flex gap-3">
        <button value="cancel" class="rounded-lg border px-4 py-1">Cancel</button>
        <button id="js-input-confirm" value="confirm"
          class="rounded-lg bg-mist-700 hover:bg-mist-800 text-slate-100 px-4 py-1">Add</button>
      </div>
    </form>
  </dialog>
  <dialog id="js-number-input" class="m-auto rounded-xl p-6 bg-slate-50 text-slate-900 dark:bg-mist-800 dark:text-slate-100
           backdrop:bg-black/50">

    <form id="js-number-form" method="dialog" class="flex flex-col items-center gap-5">
      <p class="text-sm opacity-70">Type a number</p>
      <div class="flex flex items-center">
        <input id="js-input-number" type="number" inputmode="numeric" value="2" class="w-24 text-center text-4xl font-bold p-1 bg-transparent
                 appearance-none focus:outline-none">
      </div>

      <p id="js-number-input-error" class="text-sm text-red-600 dark:text-red-400 h-5"></p>
      <div class="flex gap-3">
        <button value="cancel" class="rounded-lg border px-4 py-1">Cancel</button>
        <button id="js-input-confirm" value="confirm"
          class="rounded-lg bg-mist-700 hover:bg-mist-800 text-slate-100 px-4 py-1">Add</button>
      </div>
    </form>
  </dialog>
  <main class="p-6 flex flex-col items-center gap-3">

    <div id="js-fraction-stage"
      class="border-4 border-white flex w-full max-w-[50rem] h-[35rem] justify-center relative mx-auto overflow-scroll select-none touch-none">
      
      <!-- <div class="js-bar flex w-60 h-14 border-2 absolute touch-none bg-mist-900" style="top: 30px; left: 20px;">
        <div class="js-part border flex-1 flex items-center justify-center bg-amber-300 text-xl">1/4</div>
        <div class="js-part border flex-1 flex items-center justify-center opacity-50">1/4</div>
        <div class="js-part border flex-1 flex items-center justify-center opacity-50">1/4</div>
        <div class="js-part border flex-1 flex items-center justify-center opacity-50">1/4</div>
        <button class="flex justify-center items-center absolute -top-3 -right-3 border-3 rounded-[100%] size-[1.5rem] bg-red-800">X</button>
        <p class="absolute -top-7.5 -left-1 text-xl font-bold">1/4</p>
      </div> -->
     

      <!-- <div class='max-w-[0.5rem] absolute flex items-center justify-center' style="top: 30px; right: 20px;">
        <div class="font-bold text-4xl flex items-center">23</div>
        <button class="absolute border-3 rounded-[100%] size-[1.5rem] bg-red-800 flex justify-center items-center -top-3 -right-3">X</button>
      </div> -->
      
    </div>
    <div class="flex gap-3">
      <button id="js-fraction-add-number-button"
        class="rounded-lg bg-mist-700 hover:bg-mist-800 w-26 h-[2rem] mx-auto">Add Number</button>
      <button id="js-fraction-add-fraction-button"
        class="rounded-lg bg-mist-700 hover:bg-mist-800 w-26 h-[2rem] mx-auto">Add Fraction</button>
      <button id="js-fraction-clear-button"
        class="rounded-lg bg-mist-700 hover:bg-mist-800 w-24 h-[2rem] mx-auto">Clear</button>
    </div>
  </main>

  <!-- JS goes at the end of body, so the HTML above already exists when it runs. -->
  <script src="js/fractions.js"></script>
</body>

</html>
