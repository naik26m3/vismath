<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Fraction Demo — VisMath</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

  <header class="p-6">
    <a href="index.html" class="text-blue-600 dark:text-blue-400 underline">&larr; Back</a>
    <h1 class="text-3xl font-bold mt-2">Fraction Demo</h1>
    <p class="text-slate-600 dark:text-slate-400">Add bars, then drag them around to compare.</p>
  </header>

  <main class="p-6">
    <div class="max-w-2xl mx-auto">

      <!-- The stage. "relative" makes it the anchor for the absolutely
           positioned bars inside it. -->
      <div id="stage"
        class="relative h-[26rem] border-4 border-slate-400 rounded-lg overflow-hidden
               bg-white dark:bg-slate-800"></div>

      <div class="flex gap-2 mt-4">
        <button id="add-btn"
          class="rounded-lg bg-blue-600 hover:bg-blue-700 text-white px-4 py-2">Add</button>
        <button id="clear-btn"
          class="rounded-lg bg-slate-500 hover:bg-slate-600 text-white px-4 py-2">Clear</button>
      </div>

    </div>
  </main>

  <script src="js/fractions-demo.js"></script>
</body>
</html>
