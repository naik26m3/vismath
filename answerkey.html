<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Answer Key — VisMath</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-stone-100 text-slate-800 h-dvh flex flex-col">

    <header class="px-6 pt-6 pb-4 w-full max-w-[52rem] mx-auto flex justify-between items-center">
        <div>
            <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800">&larr; Back</a>
            <h1 class="text-2xl font-bold mt-1 text-slate-900">Answer Key</h1>
        </div>
        <select name="" id="" class="w-[50%] rounded-lg bg-white border h-[2.5rem] ps-2">
        <optgroup label="Chapter 1">
            <option value="data/mhr-grade-9/1.0.json">Get Ready</option>
            <option value="data/mhr-grade-9/1.1.json">1.1 Focus on Problem Solving</option>
        </optgroup>
    </select>
    </header>
    

    <main class="max-w-[52rem] mx-auto  px-6 pb-8 flex-1 min-h-0 flex flex-col gap-5">
        <div id="js-question"
            class="border rounded-2xl w-[95%] mx-auto flex-1 flex flex-col bg-white min-h-0 overflow-hidden">
            <div class="flex justify-between border-b">
                <p id="js-question-page-number" class=" shrink-0 h-[3rem] flex items-center px-3 text-2xl"></p>
                <div class="flex justify-center items-center gap-4 me-3">
                    <button id="js-question-left-btn"
                        class="bg-indigo-500 hover:bg-indigo-900 w-[3rem] h-[2rem] rounded-lg text-white text-2xl flex items-center justify-center pb-1">←</button>
                    <button id="js-question-right-btn"
                        class="bg-indigo-500 hover:bg-indigo-900 w-[3rem] h-[2rem] rounded-lg text-white text-2xl flex items-center justify-center pb-1">→</button>
                </div>
            </div>
            <div class="overflow-auto min-h-0">
                <img id="js-question-page">
            </div>
        </div>

        <div id="js-answer"
            class="border rounded-2xl w-[95%] mx-auto flex-1 flex flex-col bg-white min-h-0 overflow-hidden">
            <div class="flex justify-between border-b">
                <p id="js-answer-page-number" class="shrink-0 h-[3rem] flex items-center px-3 text-2xl"></p>
                <div class="flex justify-center items-center gap-4 me-3">
                    <button id="js-answer-left-btn"
                        class="bg-indigo-500 hover:bg-indigo-900 w-[3rem] h-[2rem] rounded-lg text-white text-2xl flex items-center justify-center pb-1">←</button>
                    <button id="js-answer-right-btn"
                        class="bg-indigo-500 hover:bg-indigo-900 w-[3rem] h-[2rem] rounded-lg text-white text-2xl flex items-center justify-center pb-1">→</button>
                </div>
            </div>

            <div class="overflow-auto min-h-0">
                <img id="js-answer-page">
            </div>
        </div>

    </main>

    <!-- JS goes at the end of body, so the HTML above already exists when it runs. -->
    <script src="js/answerkey.js"></script>
</body>

</html>
