<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Andswer Key</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- The lesson data, bundled by tools/demo_data.py so this opens by double-click. -->
  <script src="answer-key-data.js"></script>
</head>

<body class="bg-stone-100 text-slate-800 h-dvh flex flex-col overflow-hidden select-none">

  <!-- top bar -->
  <header class="shrink-0 bg-white border-b border-slate-200 px-3 py-2 flex items-center gap-3">
    <select id="lesson"
      class="min-w-0 flex-1 landscape:flex-none landscape:w-72 rounded-xl border border-slate-300 bg-white px-3 h-12 text-base font-medium"></select>

    <!-- the two modes -->
    <div class="shrink-0 inline-flex rounded-xl border border-slate-300 bg-white p-1">
      <button id="modeQuestions" class="rounded-lg px-3 h-10 text-sm font-medium">Questions</button>
      <button id="modePages" class="rounded-lg px-3 h-10 text-sm font-medium">Pages</button>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <button id="prev" aria-label="Previous"
        class="rounded-xl border border-slate-300 bg-white active:bg-slate-100 w-14 h-12 text-xl">&larr;</button>
      <p id="position" class="w-16 text-center text-sm font-semibold tabular-nums text-slate-600"></p>
      <button id="next" aria-label="Next"
        class="rounded-xl bg-sky-600 active:bg-sky-700 text-white w-14 h-12 text-xl">&rarr;</button>
    </div>
  </header>

  <main class="flex-1 min-h-0 flex flex-col landscape:flex-row gap-3 p-3">

    <!-- question picker (Questions mode only): a strip in portrait, a rail in landscape -->
    <nav id="rail"
      class="shrink-0 flex landscape:flex-col gap-4 overflow-auto rounded-2xl bg-white border border-slate-200 p-3
             landscape:w-44"></nav>

    <!-- QUESTION side -->
    <section id="questionPane"
      class="flex-1 min-h-0 min-w-0 flex flex-col rounded-2xl bg-white border border-slate-200 shadow-sm">
      <div class="shrink-0 flex items-center gap-2 px-4 h-12 border-b border-slate-200">
        <h2 id="questionTitle" class="text-sm font-semibold text-slate-900 truncate"></h2>
        <div class="ml-auto flex gap-2">
          <button id="pageBtn" class="rounded-lg border border-slate-300 px-3 h-9 text-sm font-medium">Whole page</button>
          <button id="wideQuestion" class="rounded-lg border border-slate-300 px-3 h-9 text-sm font-medium">Wide</button>
        </div>
      </div>
      <div id="questionBody" class="flex-1 min-h-0 overflow-auto p-4 flex flex-col gap-3"></div>
    </section>

    <!-- ANSWER side -->
    <section id="answerPane"
      class="flex-1 min-h-0 min-w-0 flex flex-col rounded-2xl bg-white border border-slate-200 shadow-sm">
      <div class="shrink-0 flex items-center gap-2 px-4 h-12 border-b border-slate-200">
        <h2 id="answerTitle" class="text-sm font-semibold text-emerald-700 truncate">Answer</h2>
        <div class="ml-auto flex gap-2">
          <!-- only in Pages mode, and only when the answers span more than one page -->
          <div id="answerPager" class="flex gap-2">
            <button id="answerPrev" aria-label="Previous answer page"
              class="rounded-lg border border-slate-300 w-10 h-9 text-base">&larr;</button>
            <button id="answerNext" aria-label="Next answer page"
              class="rounded-lg border border-slate-300 w-10 h-9 text-base">&rarr;</button>
          </div>
          <button id="hideBtn" class="rounded-lg border border-slate-300 px-3 h-9 text-sm font-medium">Hide</button>
          <button id="wideAnswer" class="rounded-lg border border-slate-300 px-3 h-9 text-sm font-medium">Wide</button>
        </div>
      </div>
      <div id="answerBody" class="flex-1 min-h-0 overflow-auto p-4 flex flex-col gap-3"></div>
    </section>

  </main>

  <script>
    const LESSONS = window.ANSWER_KEY_LESSONS || [];
    const ROOT = "../";                       // image paths are relative to the project root

    const $ = (id) => document.getElementById(id);
    const lessonSelect = $("lesson");
    const rail = $("rail");

    let lesson = null;        // the lesson object on screen
    let mode = "questions";   // "questions" | "pages"
    let at = 0;               // Questions mode: index into lesson.items
    let showPage = false;     // Questions mode: crop, or the whole book page
    let qPage = 0;            // Pages mode: index into lesson.pageImages
    let aPage = 0;            // Pages mode: index into lesson.answerPageImages
    let answerHidden = false; // stays as you move around
    let wide = null;          // "question" | "answer" | null

    // ---- remember where you were --------------------------------------
    function remember() {
      try {
        localStorage.setItem("answer-key-demo",
          JSON.stringify({ lesson: lesson.lesson, at, mode, qPage, aPage, answerHidden }));
      } catch (e) {}
    }
    function recall() {
      try { return JSON.parse(localStorage.getItem("answer-key-demo")) || {}; }
      catch (e) { return {}; }
    }

    // ---- helpers --------------------------------------------------------
    function images(paths, emptyText) {
      const frag = document.createDocumentFragment();
      if (!paths || paths.length === 0) {
        const p = document.createElement("p");
        p.className = "text-slate-400 text-center mt-10";
        p.textContent = emptyText;
        frag.appendChild(p);
        return frag;
      }
      for (const path of paths) {
        const img = document.createElement("img");
        img.src = ROOT + path;
        img.alt = "";
        img.draggable = false;
        img.className = "w-full max-w-3xl mx-auto";
        frag.appendChild(img);
      }
      return frag;
    }

    // ".../pages/p008.webp" -> 8
    function bookPageOf(path) {
      const m = path.match(/p(\d+)\.webp$/);
      return m ? Number(m[1]) : "?";
    }

    // "assets/.../questions/1.1-p008-q02-practise.webp" -> ".../pages/p008.webp"
    function pagesFor(item) {
      const seen = [];
      for (const path of item.questionImages) {
        const m = path.match(/-(p\d+)-q\d+/);
        if (!m) continue;
        const page = path.replace(/questions\/[^/]+$/, "pages/" + m[1] + ".webp");
        if (!seen.includes(page)) seen.push(page);
      }
      return seen;
    }

    function toggleStyle(button, on, base) {
      button.className = (base || "rounded-lg px-3 h-9 text-sm font-medium border ") +
        (on ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 bg-white");
    }

    function dim(button, off) {
      button.disabled = off;
      button.classList.toggle("opacity-40", off);
    }

    // ---- the rail of question numbers (Questions mode) -------------------
    function drawRail() {
      rail.innerHTML = "";
      let group = null, grid = null;

      lesson.items.forEach((item, index) => {
        if (item.section !== group) {
          group = item.section;
          const block = document.createElement("div");
          block.className = "shrink-0";

          const label = document.createElement("p");
          label.className = "text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2 whitespace-nowrap";
          label.textContent = group;
          block.appendChild(label);

          grid = document.createElement("div");
          // one row in portrait, three columns in landscape
          grid.className = "grid grid-flow-col auto-cols-max gap-2 " +
                           "landscape:grid-flow-row landscape:auto-cols-auto landscape:grid-cols-3";
          block.appendChild(grid);
          rail.appendChild(block);
        }

        const button = document.createElement("button");
        button.dataset.index = index;
        button.textContent = item.number;
        grid.appendChild(button);
      });
    }

    function paintRail() {
      for (const button of rail.querySelectorAll("button")) {
        const index = Number(button.dataset.index);
        const noAnswer = lesson.items[index].answerImages.length === 0;
        const on = index === at;
        button.className = "h-12 min-w-12 rounded-xl font-semibold tabular-nums border " +
          (on ? "bg-sky-600 text-white border-sky-600"
              : noAnswer ? "bg-white border-dashed border-slate-300 text-slate-400"
                         : "bg-white border-slate-300 text-slate-700 active:bg-slate-100");
        if (on) button.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    // ---- drawing -----------------------------------------------------------
    function fillAnswer(paths, emptyText) {
      const a = $("answerBody");
      a.innerHTML = "";
      if (answerHidden) {
        const reveal = document.createElement("button");
        reveal.className = "m-auto rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 px-8 py-6 text-lg";
        reveal.textContent = "Tap to show the answers";
        reveal.onclick = () => { answerHidden = false; render(); };
        a.appendChild(reveal);
      } else {
        a.appendChild(images(paths, emptyText));
      }
      a.scrollTop = 0;
    }

    function renderQuestions() {
      const item = lesson.items[at];

      $("position").textContent = (at + 1) + " / " + lesson.items.length;
      $("questionTitle").textContent = "Question " + item.number +
        (item.section === "Questions" ? "" : " · " + item.section);
      $("answerTitle").textContent = "Answer";

      const q = $("questionBody");
      q.innerHTML = "";
      q.appendChild(images(showPage ? pagesFor(item) : item.questionImages, "No picture for this question."));
      q.scrollTop = 0;
      toggleStyle($("pageBtn"), showPage);

      fillAnswer(item.answerImages, "The book prints no answer for this question.");

      dim($("prev"), at === 0);
      dim($("next"), at === lesson.items.length - 1);
      paintRail();
    }

    function renderPages() {
      const qPages = lesson.pageImages;
      const aPages = lesson.answerPageImages || [];
      qPage = Math.max(0, Math.min(qPages.length - 1, qPage));
      aPage = Math.max(0, Math.min(Math.max(aPages.length - 1, 0), aPage));

      $("position").textContent = (qPage + 1) + " / " + qPages.length;
      $("questionTitle").textContent = "Book page " + bookPageOf(qPages[qPage]);
      $("answerTitle").textContent = aPages.length
        ? "Answers · page " + bookPageOf(aPages[aPage]) +
          (aPages.length > 1 ? "  (" + (aPage + 1) + " of " + aPages.length + ")" : "")
        : "Answers";

      const q = $("questionBody");
      q.innerHTML = "";
      q.appendChild(images([qPages[qPage]], "No page."));
      q.scrollTop = 0;

      fillAnswer(aPages.length ? [aPages[aPage]] : [], "No answer page for this lesson.");

      dim($("prev"), qPage === 0);
      dim($("next"), qPage === qPages.length - 1);
      dim($("answerPrev"), aPage === 0);
      dim($("answerNext"), aPage >= aPages.length - 1);
      $("answerPager").classList.toggle("hidden", aPages.length < 2);
    }

    function render() {
      const pages = mode === "pages";

      rail.classList.toggle("hidden", pages);
      $("pageBtn").classList.toggle("hidden", pages);
      $("answerPager").classList.toggle("hidden", !pages);

      const tab = "rounded-lg px-3 h-10 text-sm font-medium ";
      $("modeQuestions").className = tab + (pages ? "text-slate-500" : "bg-sky-600 text-white");
      $("modePages").className = tab + (pages ? "bg-sky-600 text-white" : "text-slate-500");

      if (pages) renderPages(); else renderQuestions();

      $("hideBtn").textContent = answerHidden ? "Show" : "Hide";
      toggleStyle($("hideBtn"), answerHidden);
      $("questionPane").classList.toggle("hidden", wide === "answer");
      $("answerPane").classList.toggle("hidden", wide === "question");
      toggleStyle($("wideQuestion"), wide === "question");
      toggleStyle($("wideAnswer"), wide === "answer");

      remember();
    }

    // ---- moving around -------------------------------------------------------
    function step(by) {
      if (mode === "pages") {
        qPage += by;
      } else {
        at = Math.max(0, Math.min(lesson.items.length - 1, at + by));
        showPage = false;               // a new question starts on its crop
      }
      render();
    }

    function setMode(next) {
      if (next === mode) return;
      if (next === "pages") {
        // open on the page the current question is on
        const pages = pagesFor(lesson.items[at]);
        const index = lesson.pageImages.indexOf(pages[0]);
        if (index !== -1) qPage = index;
      } else {
        // come back to the first question on the page you were looking at
        const page = lesson.pageImages[qPage];
        const index = lesson.items.findIndex((item) => pagesFor(item).includes(page));
        if (index !== -1) at = index;
        showPage = false;
      }
      mode = next;
      render();
    }

    function openLesson(id, saved) {
      lesson = LESSONS.find((l) => l.lesson === id) || LESSONS[0];
      lessonSelect.value = lesson.lesson;
      at = Math.max(0, Math.min(lesson.items.length - 1, (saved && saved.at) || 0));
      qPage = (saved && saved.qPage) || 0;
      aPage = (saved && saved.aPage) || 0;
      showPage = false;
      drawRail();
      render();
    }

    // ---- wiring ------------------------------------------------------------
    if (LESSONS.length === 0) {
      document.querySelector("main").innerHTML =
        "<p class='m-auto text-slate-500'>No data. Run <code>python tools/demo_data.py</code> first.</p>";
    } else {
      for (const l of LESSONS) {
        const option = document.createElement("option");
        option.value = l.lesson;
        option.textContent = (l.lesson.endsWith(".0") || l.lesson.endsWith(".R") ? "" : l.lesson + "  ") + l.title;
        lessonSelect.appendChild(option);
      }

      lessonSelect.addEventListener("change", () => openLesson(lessonSelect.value, null));
      rail.addEventListener("click", (e) => {
        const button = e.target.closest("button[data-index]");
        if (!button) return;
        at = Number(button.dataset.index);
        showPage = false;
        render();
      });

      $("prev").onclick = () => step(-1);
      $("next").onclick = () => step(1);
      $("answerPrev").onclick = () => { aPage--; render(); };
      $("answerNext").onclick = () => { aPage++; render(); };
      $("modeQuestions").onclick = () => setMode("questions");
      $("modePages").onclick = () => setMode("pages");
      $("pageBtn").onclick = () => { showPage = !showPage; render(); };
      $("hideBtn").onclick = () => { answerHidden = !answerHidden; render(); };
      $("wideQuestion").onclick = () => { wide = wide === "question" ? null : "question"; render(); };
      $("wideAnswer").onclick = () => { wide = wide === "answer" ? null : "answer"; render(); };

      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "SELECT") return;
        if (e.key === "ArrowRight") step(1);
        else if (e.key === "ArrowLeft") step(-1);
        else if (e.key === " ") { e.preventDefault(); answerHidden = !answerHidden; render(); }
      });

      const saved = recall();
      answerHidden = Boolean(saved.answerHidden);
      mode = saved.mode === "pages" ? "pages" : "questions";
      openLesson(saved.lesson, saved);
    }
  </script>

</body>

</html>
