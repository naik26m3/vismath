<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Number Line</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-stone-100 text-slate-800">

  <div class="max-w-[64rem] mx-auto px-6 py-10">

    <h1 class="text-2xl font-bold text-slate-900">Number Line — demo</h1>
    <p class="mt-1 mb-8 text-sm text-slate-500">
      Two modes. Slider keeps the arrow still and moves the line; Full shows the whole
      range wrapped onto rows.
    </p>

    <!-- mode -->
    <div class="inline-flex rounded-xl border border-slate-300 bg-white p-1 mb-6">
      <button id="modeSlider" class="rounded-lg px-5 h-10 font-medium">Slider</button>
      <button id="modeFull" class="rounded-lg px-5 h-10 font-medium">Full</button>
    </div>

    <!-- range controls -->
    <div class="flex flex-wrap items-end gap-4 mb-8">
      <label class="flex flex-col text-xs font-medium text-slate-500">
        Min
        <input id="min" type="number" value="0"
          class="mt-1 w-24 rounded-xl border border-slate-300 bg-white px-3 h-11 text-lg">
      </label>
      <label class="flex flex-col text-xs font-medium text-slate-500">
        Max
        <input id="max" type="number" value="66"
          class="mt-1 w-24 rounded-xl border border-slate-300 bg-white px-3 h-11 text-lg">
      </label>
      <label class="flex flex-col text-xs font-medium text-slate-500">
        Step size
        <input id="stepSize" type="number" value="1" min="1"
          class="mt-1 w-24 rounded-xl border border-slate-300 bg-white px-3 h-11 text-lg">
      </label>
      <label id="perRowBox" class="flex flex-col text-xs font-medium text-slate-500">
        Per row
        <input id="perRow" type="number" value="20" min="2"
          class="mt-1 w-24 rounded-xl border border-slate-300 bg-white px-3 h-11 text-lg">
      </label>
      <p id="rangeError" class="text-sm font-medium text-red-600 h-11 leading-[2.75rem]"></p>
    </div>

    <!-- SLIDER MODE: a window, with a track that moves inside it -->
    <div id="viewport"
      class="relative h-56 overflow-hidden rounded-2xl bg-white border border-slate-200 shadow-sm">

      <div class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-px bg-rose-200 pointer-events-none"></div>
      <div class="absolute left-1/2 -translate-x-1/2 pointer-events-none z-10" style="top: 104px;">
        <div class="text-4xl leading-none text-rose-500">&#9660;</div>
      </div>

      <div id="track" class="absolute top-0 left-0 h-full transition-transform duration-200 ease-out">
        <svg id="arcs" class="absolute left-0" style="top: 20px; height: 120px;"></svg>
        <div id="ticks" class="absolute left-0" style="top: 140px;"></div>
      </div>
    </div>

    <!-- FULL MODE: the range wrapped onto rows -->
    <div id="rows"
      class="rounded-2xl bg-white border border-slate-200 shadow-sm px-10 py-8 flex flex-col gap-10">
    </div>

    <!-- stepping -->
    <div class="mt-8 flex flex-wrap items-center gap-3">
      <button data-jump="-10"
        class="rounded-xl bg-white border border-slate-300 hover:bg-slate-100 px-5 h-16 text-xl font-medium tabular-nums">&minus;10</button>
      <button data-jump="-1"
        class="rounded-xl bg-white border border-slate-300 hover:bg-slate-100 px-5 h-16 text-xl font-medium tabular-nums">&minus;1</button>
      <button data-jump="1"
        class="rounded-xl bg-sky-600 hover:bg-sky-700 text-white px-5 h-16 text-xl font-medium tabular-nums">+1</button>
      <button data-jump="10"
        class="rounded-xl bg-sky-600 hover:bg-sky-700 text-white px-5 h-16 text-xl font-medium tabular-nums">+10</button>

      <button id="reset"
        class="rounded-xl bg-white border border-slate-300 hover:bg-slate-100 px-5 h-16 font-medium">
        Start here
      </button>

      <div class="ml-auto text-right">
        <p id="readout" class="text-3xl font-bold text-slate-900 tabular-nums"></p>
        <p id="distance" class="text-sm text-slate-500 tabular-nums"></p>
      </div>
    </div>

    <p class="mt-6 text-sm text-slate-500">
      Tap any number to move the start there.
    </p>

  </div>

  <script>
    const SPACING = 90;   // px between marks, slider mode only

    const el = (id) => document.getElementById(id);

    const minInput  = el("min");
    const maxInput  = el("max");
    const stepInput = el("stepSize");
    const perRowInp = el("perRow");
    const perRowBox = el("perRowBox");
    const viewport  = el("viewport");
    const track     = el("track");
    const ticksBox  = el("ticks");
    const arcs      = el("arcs");
    const rowsBox   = el("rows");
    const readout   = el("readout");
    const distance  = el("distance");
    const rangeError = el("rangeError");

    let mode = "slider";
    let min = 0, max = 66, step = 1, perRow = 20;
    let start = 0, current = 0;

    const SVG_NS = "http://www.w3.org/2000/svg";

    // ---------- shared pieces -------------------------------------

    function makeTick(value, positionCss) {
      const tick = document.createElement("button");
      tick.className = "absolute -translate-x-1/2 top-0 flex flex-col items-center gap-1";
      tick.style.left = positionCss;
      tick.dataset.value = value;

      const line = document.createElement("div");
      line.className = "w-0.5 h-5 bg-slate-400";

      const label = document.createElement("div");
      label.className = "text-base font-medium text-slate-600 tabular-nums";
      label.textContent = value;

      tick.appendChild(line);
      tick.appendChild(label);
      return tick;
    }

    // One hop, as an arc with its size written on it.
    function makeArc(x1, x2, baseline, peak, label, colour) {
      const group = document.createElementNS(SVG_NS, "g");

      const path = document.createElementNS(SVG_NS, "path");
      const midX = (x1 + x2) / 2;
      path.setAttribute("d", `M ${x1} ${baseline} Q ${midX} ${peak} ${x2} ${baseline}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", colour);
      path.setAttribute("stroke-width", "3");
      group.appendChild(path);

      const text = document.createElementNS(SVG_NS, "text");
      text.setAttribute("x", midX);
      text.setAttribute("y", (baseline + peak) / 2 - 2);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", colour);
      text.setAttribute("font-size", "15");
      text.setAttribute("font-weight", "600");
      text.textContent = label;
      group.appendChild(text);

      return group;
    }

    // The journey, as a list of hops. Jump buttons can be bigger than one step,
    // so the hops are whatever was actually pressed.
    let hops = [];   // each: { from, to }

    function hopColour(hop) {
      return hop.to > hop.from ? "#0284c7" : "#e11d48";
    }

    function hopLabel(hop) {
      const size = Math.abs(hop.to - hop.from);
      return (hop.to > hop.from ? "+" : "−") + size;
    }

    // ---------- slider mode ---------------------------------------

    const xOf = (value) => (value - min) / step * SPACING;
    const trackWidth = () => xOf(max) + SPACING;

    function renderSlider() {
      ticksBox.innerHTML = "";

      const rule = document.createElement("div");
      rule.className = "absolute top-0 h-0.5 bg-slate-300";
      rule.style.width = trackWidth() + "px";
      ticksBox.appendChild(rule);

      for (let n = min; n <= max; n += step) {
        ticksBox.appendChild(makeTick(n, xOf(n) + "px"));
      }

      arcs.setAttribute("width", trackWidth());
      arcs.setAttribute("height", 120);
      arcs.innerHTML = "";
      for (const hop of hops) {
        arcs.appendChild(makeArc(xOf(hop.from), xOf(hop.to), 118, 25, hopLabel(hop), hopColour(hop)));
      }

      track.style.width = trackWidth() + "px";
      track.style.transform = `translateX(${viewport.clientWidth / 2 - xOf(current)}px)`;
    }

    // ---------- full mode -----------------------------------------

    function rowRanges() {
      const list = [];
      for (let from = min; from < max; from += perRow) {
        list.push({ from, to: Math.min(from + perRow, max) });
      }
      return list;
    }

    function renderFull() {
      rowsBox.innerHTML = "";

      for (const row of rowRanges()) {
        // Measured against perRow, not the row's own span — so a short last row
        // keeps the same spacing as the full ones and simply stops early.
        const pct = (value) => (value - row.from) / perRow * 100;

        const wrap = document.createElement("div");
        wrap.className = "relative";

        // arcs for hops that live entirely inside this row
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("class", "w-full block");
        svg.setAttribute("height", "90");
        svg.setAttribute("viewBox", "0 0 1000 90");
        svg.setAttribute("preserveAspectRatio", "none");

        for (const hop of hops) {
          const lo = Math.min(hop.from, hop.to);
          const hi = Math.max(hop.from, hop.to);
          if (lo < row.from || hi > row.to) continue;
          svg.appendChild(makeArc(pct(hop.from) * 10, pct(hop.to) * 10, 88, 18,
                                  hopLabel(hop), hopColour(hop)));
        }
        wrap.appendChild(svg);

        const line = document.createElement("div");
        line.className = "relative h-14";

        const rule = document.createElement("div");
        rule.className = "absolute left-0 top-0 h-0.5 bg-slate-400";
        rule.style.width = pct(row.to) + "%";
        line.appendChild(rule);

        for (let n = row.from; n <= row.to; n += step) {
          line.appendChild(makeTick(n, pct(n) + "%"));
        }

        // the marker, if the student is standing on this row
        if (current >= row.from && current <= row.to) {
          const onLaterRow = current === row.from && row.from !== min;
          const onEarlierRow = current === row.to && row.to !== max;
          if (!onEarlierRow || onLaterRow) {
            const mark = document.createElement("div");
            mark.className = "absolute -translate-x-1/2 -top-1 text-3xl leading-none text-rose-500 pointer-events-none";
            mark.style.left = pct(current) + "%";
            mark.textContent = "▼";
            line.appendChild(mark);
          }
        }

        wrap.appendChild(line);
        rowsBox.appendChild(wrap);
      }
    }

    // ---------- shared ---------------------------------------------

    function render() {
      viewport.classList.toggle("hidden", mode !== "slider");
      rowsBox.classList.toggle("hidden", mode !== "full");
      perRowBox.classList.toggle("hidden", mode !== "full");

      el("modeSlider").className = "rounded-lg px-5 h-10 font-medium " +
        (mode === "slider" ? "bg-sky-600 text-white" : "text-slate-500");
      el("modeFull").className = "rounded-lg px-5 h-10 font-medium " +
        (mode === "full" ? "bg-sky-600 text-white" : "text-slate-500");

      if (mode === "slider") renderSlider(); else renderFull();

      readout.textContent = String(current);
      const moved = current - start;
      distance.textContent = moved === 0
        ? `started at ${start}`
        : `${start} ${moved > 0 ? "+" : "−"} ${Math.abs(moved)} = ${current}`;
    }

    function jump(size) {
      const target = current + size;
      if (target < min || target > max) return;
      hops.push({ from: current, to: target });
      current = target;
      render();
    }

    function readRange() {
      const a = Number(minInput.value);
      const b = Number(maxInput.value);
      const s = Number(stepInput.value);
      const p = Number(perRowInp.value);

      if (![a, b, s, p].every(Number.isInteger)) {
        rangeError.textContent = "Whole numbers only";
        return;
      }
      if (b <= a) { rangeError.textContent = "Max must be bigger than min"; return; }
      if (s < 1)  { rangeError.textContent = "Step must be at least 1"; return; }
      if (p < 2)  { rangeError.textContent = "Per row must be at least 2"; return; }

      rangeError.textContent = "";
      min = a; max = b; step = s; perRow = p;
      start = min;
      current = min;
      hops = [];
      render();
    }

    // ---------- events ---------------------------------------------

    document.addEventListener("click", (e) => {
      const tick = e.target.closest("[data-value]");
      if (!tick) return;
      start = Number(tick.dataset.value);
      current = start;
      hops = [];
      render();
    });

    for (const button of document.querySelectorAll("[data-jump]")) {
      button.addEventListener("click", () => jump(Number(button.dataset.jump)));
    }

    el("reset").addEventListener("click", () => {
      start = current;
      hops = [];
      render();
    });

    el("modeSlider").addEventListener("click", () => { mode = "slider"; render(); });
    el("modeFull").addEventListener("click", () => { mode = "full"; render(); });

    for (const input of [minInput, maxInput, stepInput, perRowInp]) {
      input.addEventListener("input", readRange);
    }
    window.addEventListener("resize", render);

    readRange();
  </script>

</body>

</html>
